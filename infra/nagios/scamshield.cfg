# -------------------------------------------------------------------
# Service: Streamlit application on port 8501
# -------------------------------------------------------------------
define service {
    use                     generic-service
    host_name               scamshield-server
    service_description     ScamShield Streamlit App
    check_command           check_tcp!8501
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_interval   30
    check_period            24x7
    notification_period     24x7
}