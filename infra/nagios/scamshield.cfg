###############################################################################
# ScamShield Nagios Host and Service Definitions
# File: /usr/local/nagios/etc/objects/scamshield.cfg
###############################################################################

# Host definition - ScamShield EC2 server (monitored locally on EC2)
define host {
    use                     linux-server
    host_name               scamshield-server
    alias                   ScamShield AWS EC2 Server (65.0.20.154)
    address                 127.0.0.1
    max_check_attempts      3
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    check_command           check-host-alive
}

# Host group
define hostgroup {
    hostgroup_name          scamshield-servers
    alias                   ScamShield Application Servers
    members                 scamshield-server
}

# -------------------------------------------------------------------
# Service: SSH connectivity
# -------------------------------------------------------------------
define service {
    use                     generic-service
    host_name               scamshield-server
    service_description     SSH Service
    check_command           check_ssh
    max_check_attempts      3
    check_interval          5
    retry_interval          2
    notification_interval   60
    check_period            24x7
    notification_period     24x7
}

# -------------------------------------------------------------------
# Service: HTTP availability (Apache)
# -------------------------------------------------------------------
define service {
    use                     generic-service
    host_name               scamshield-server
    service_description     HTTP Availability
    check_command           check_http
    max_check_attempts      3
    check_interval          5
    retry_interval          2
    notification_interval   60
    check_period            24x7
    notification_period     24x7
}

# -------------------------------------------------------------------
# Service: Apache2 process
# -------------------------------------------------------------------
define service {
    use                     generic-service
    host_name               scamshield-server
    service_description     Apache Service
    check_command           check_apache2
    max_check_attempts      3
    check_interval          5
    retry_interval          2
    notification_interval   60
    check_period            24x7
    notification_period     24x7
}

# -------------------------------------------------------------------
# Service: Nagios Core service
# -------------------------------------------------------------------
define service {
    use                     generic-service
    host_name               scamshield-server
    service_description     Nagios Service
    check_command           check_nagios
    max_check_attempts      3
    check_interval          5
    retry_interval          2
    notification_interval   60
    check_period            24x7
    notification_period     24x7
