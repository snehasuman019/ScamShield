# NRPE local check commands for ScamShield EC2 server
# File: /etc/nagios/nrpe.d/scamshield_local.cfg

command[check_load]=/usr/lib/nagios/plugins/check_load -w 1.5,1.5,1.5 -c 3.0,3.0,3.0
command[check_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_mem]=/usr/lib/nagios/plugins/check_mem -f -w 80 -c 90
